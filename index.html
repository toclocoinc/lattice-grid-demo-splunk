<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>SOC Triage Wall over Splunk - Lattice Grid</title>
        <link rel="icon" href="data:,">
        <script>
            // Where the library comes from. `false` loads the published release from the CDN;
            // `true` loads a local build from vendor/ instead (not part of this repository).
            const LOCAL = false;
            const LIB = LOCAL ? 'vendor/' : 'https://cdn.jsdelivr.net/npm/@toclocoinc/lattice-grid@1.86.2/';
            document.write('<link rel="stylesheet" href="' + LIB + 'lattice-grid.min.css">');
            for (const file of ['lattice-grid.min.js', 'modules/layout.min.js', 'modules/charts.min.js', 'modules/kpi.min.js']) {
                document.write('<script src="' + LIB + file + '"><' + '/script>');
            }
        </script>
        <style>
            body { padding: 0; margin: 0; background: #14181c; color: #e4e9ee;
                   font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
            [data-lat-layout-body] { overflow: hidden; background: #14181c; color: #e4e9ee; }
            .panel { display: flex; flex-direction: column; height: 100%; box-sizing: border-box; padding: 4px 8px 2px; }
            .panel__head { flex: 0 0 auto; font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
                           color: #99a4ae; padding: 0 2px 3px; }
            .panel__body { flex: 1 1 auto; min-height: 0; position: relative; overflow: auto; font-size: 12px; }
            .alarm { color: #ff8a80; padding: 3px 0; border-bottom: 1px solid #2a2f35; }
            .ok { color: #6dbf7a; }
            .byo input { width: 100%; margin: 4px 0; background: #1c2127; border: 1px solid #333a42; color: #e4e9ee;
                         padding: 5px 6px; box-sizing: border-box; font-size: 12px; }
            .byo button { margin-top: 6px; padding: 5px 10px; }
            .byo .note { color: #8a95a1; font-size: 10.5px; margin-top: 6px; }
            #byo-error { color: #ff8a80; font-size: 11px; margin-top: 4px; min-height: 14px; }
            #live-tail { position: fixed; bottom: 4px; right: 10px; z-index: 6; font-size: 11px; background: #14181c; padding: 2px 6px; }
            body[data-theme="light"] #live-tail { background: #f4f6f8; }
            #attribution { position: fixed; bottom: 4px; left: 8px; font-size: 10px; color: #6b7680; z-index: 5; }
            body[data-theme="light"], body[data-theme="light"] [data-lat-layout-body] { background: #f4f6f8; color: #1c2127; }
            body[data-theme="light"] .panel__head { color: #5b6570; }
            body[data-theme="light"] .byo input { background: #fff; border-color: #c7ccd1; color: #1c2127; }
        </style>
    </head>
    <body data-theme="dark">
        <script>
            // ?theme=light forces the light theme; dark is the default.
            if (new URLSearchParams(location.search).get('theme') === 'light') document.body.dataset.theme = 'light';
        </script>
        <label id="live-tail"><input type="checkbox" id="live-toggle"> Live tail (rolling 15 min window)</label>
        <div id="attribution">Data: synthetic auth+firewall index generated on load (ours, CC0) &middot; demo mode answers Splunk's search REST API from a mock</div>
        <div id="container" style="height: 100vh; margin: 0; padding: 0"></div>

        <script type="module" src="app.js"></script>

</html>
